name: Build web, Windows and Android

on:
  push:
    branches: [main, cancer-screening-app]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:iraq
      - uses: actions/upload-artifact@v4
        with: { name: web-build, path: dist }
      - uses: actions/upload-artifact@v4
        with: { name: web-build-iraq, path: dist-iraq }
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: dist }

  website:
    # Public website for the app branch: published to the gh-pages branch (GitHub Pages, served through a CDN).
    # If CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are set, also deploys to Cloudflare Pages
    # (unlimited bandwidth; recommended for national-scale traffic).
    needs: web
    if: github.ref == 'refs/heads/cancer-screening-app'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: web-build, path: site }
      # Iraq edition: same site, under iraq/
      - uses: actions/download-artifact@v4
        with: { name: web-build-iraq, path: site/iraq }
      - run: touch site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
      # Pushes made with GITHUB_TOKEN don't start a Pages build by themselves, so request one.
      - run: >-
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json"
          https://api.github.com/repos/${{ github.repository }}/pages/builds
      - name: Cloudflare Pages (optional)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy site --project-name cancer-screening-guide --branch main

  pages:
    # Publishes the web app on GitHub Pages. Enable Pages (Settings > Pages > Source: GitHub Actions) once.
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - { edition: krg, script: 'electron:win', out: release, name: windows }
          - { edition: iraq, script: 'electron:win:iraq', out: release-iraq, name: windows-iraq }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.out }}/*.exe

  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { edition: krg, build: 'build:electron', apk: CancerScreeningGuide.apk, name: android }
          - { edition: iraq, build: 'build:iraq:electron', apk: CancerScreeningGuide-Iraq.apk, name: android-iraq }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      # GitHub's ubuntu runners ship the Android SDK (ANDROID_HOME); no setup action needed.
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      # Same build as the desktop app: no service worker inside the Android WebView.
      - run: npm run ${{ matrix.build }}
      # The Iraq edition is a separate Android app, so it installs next to the Kurdistan one.
      - name: Iraq app ID and name
        if: matrix.edition == 'iraq'
        run: |
          jq '.appId = "iq.health.cancerscreening" | .appName = "Cancer Screening Guide Iraq"' capacitor.config.json > c.json
          mv c.json capacitor.config.json
      - run: npx cap add android
      # Always light: use a light app theme and stop Android from auto-darkening the page in dark mode.
      - name: Force light theme
        run: |
          f=android/app/src/main/res/values/styles.xml
          sed -i 's/DayNight/Light/g' "$f"
          sed -i '/<style name="AppTheme[^"]*"/a\        <item name="android:forceDarkAllowed">false</item>' "$f"
          grep -n 'forceDarkAllowed\|parent=' "$f"
      - name: App icons
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#b0306a'
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.apk }}
      - uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.name }}', path: '${{ matrix.apk }}' }

  release:
    # Publishes the .exe, .apk and web zip as a public GitHub Release named after package.json's version.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/cancer-screening-app'
    needs: [web, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: cd artifacts/web-build && zip -r ../../CancerScreeningGuide-web.zip .
      - run: cd artifacts/web-build-iraq && zip -r ../../CancerScreeningGuide-Iraq-web.zip .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Cancer Screening Guide ${{ steps.version.outputs.tag }}
          body: |
            Two editions: Kurdistan Region (files without "Iraq") and Iraq (files with "Iraq" in the name). They install side by side.
            Iraq website: https://mohammed7815ai-eng.github.io/MAH7815/iraq/
            Windows: download Cancer-Screening-Guide-Setup (installer with Start menu and desktop shortcuts) or the Portable .exe (runs without installing).
            Android: download CancerScreeningGuide.apk on the phone and open it (allow installing from this source when asked).
            Web: unzip CancerScreeningGuide-web.zip and host it, or open index.html.
            Kurdish and Arabic texts are machine-drafted; use the Edit translations tab to correct them.
          files: |
            artifacts/windows/*.exe
            artifacts/windows-iraq/*.exe
            artifacts/android/*.apk
            artifacts/android-iraq/*.apk
            CancerScreeningGuide-web.zip
            CancerScreeningGuide-Iraq-web.zip
