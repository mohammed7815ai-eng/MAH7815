name: Short share links
# Creates short HTTPS links for the two app pages hosted on claude.ai (no GitHub address in them).
# Run from the Actions tab (re-running is harmless: an alias that already exists is left unchanged).
on:
  workflow_dispatch:
  push:
    branches: [cancer-screening-app]
    paths: ['.github/workflows/shortlink.yml']
jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - run: |
          make() {  # alias, destination
            echo "== $1 -> $2"
            echo "tinyurl: $(curl -sS "https://tinyurl.com/api-create.php?alias=$1&url=$2")"
            echo "is.gd:   $(curl -sS "https://is.gd/create.php?format=simple&shorturl=$1&url=$2")"
            echo "check tinyurl: $(curl -sSI "https://tinyurl.com/$1" | grep -i '^location')"
            echo "check is.gd:   $(curl -sSI "https://is.gd/$1" | grep -i '^location')"
          }
          make CancerScreeningKRG https://claude.ai/artifact/XbVwLNPEXmC86Yo5Ny3fNr
          make CancerScreeningIraq https://claude.ai/artifact/Lq8dyudRqQTqtnQUrord63
